name: Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality Analysis

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, sqlite, pcov

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('**/composer.lock') }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Install Larastan
        run: |
          echo "Installing Larastan..."
          composer require --dev larastan/larastan --with-all-dependencies || {
            echo "⚠️ Failed to install Larastan, trying alternative..."
            composer require --dev nunomaduro/larastan --with-all-dependencies
          }

      - name: Create PHPStan config
        run: |
          cat > phpstan.neon << EOF
          includes:
              - vendor/larastan/larastan/extension.neon

          parameters:
              paths:
                  - app/
                  - routes/
                  - database/
              level: 5
              ignoreErrors:
                  - '#Call to an undefined method Illuminate\\Database\\Eloquent\\Builder::.*#'
                  - '#Call to an undefined method Illuminate\\Database\\Query\\Builder::.*#'
                  - '#Method App\\Http\\Controllers\\.*Controller::.* has no return type specified#'
                  - '#Method App\\Livewire\\.*::.* has no return type specified#'
                  - '#Missing return type on function .*#'
              excludePaths:
                  - */vendor/*
                  - */node_modules/*
                  - */storage/*
                  - */bootstrap/cache/*
                  - */database/migrations/*
          EOF      - name: Run PHPStan Analysis
        run: |
          if [ -f "./vendor/bin/phpstan" ]; then
            ./vendor/bin/phpstan analyse --memory-limit=2G --no-progress
          else
            echo "⚠️ PHPStan not available, skipping static analysis"
          fi

      - name: Install PHP CS Fixer
        run: |
          echo "Installing PHP CS Fixer..."
          composer require --dev friendsofphp/php-cs-fixer --with-all-dependencies || {
            echo "⚠️ Failed to install PHP CS Fixer, trying global installation..."
            curl -L https://cs.symfony.com/download/php-cs-fixer-v3.phar -o php-cs-fixer
            chmod +x php-cs-fixer
          }

      - name: Create PHP CS Fixer config
        run: |
          cat > .php-cs-fixer.php << 'EOF'
          <?php

          $finder = Symfony\Component\Finder\Finder::create()
              ->in([
                  __DIR__ . '/app',
                  __DIR__ . '/config',
                  __DIR__ . '/database',
                  __DIR__ . '/routes',
                  __DIR__ . '/tests',
              ])
              ->name('*.php')
              ->notName('*.blade.php')
              ->ignoreDotFiles(true)
              ->ignoreVCS(true);

          return (new PhpCsFixer\Config())
              ->setRules([
                  '@PSR2' => true,
                  '@Symfony' => true,
                  'array_syntax' => ['syntax' => 'short'],
                  'ordered_imports' => ['sort_algorithm' => 'alpha'],
                  'no_unused_imports' => true,
                  'not_operator_with_successor_space' => true,
                  'trailing_comma_in_multiline' => true,
                  'phpdoc_scalar' => true,
                  'unary_operator_spaces' => true,
                  'binary_operator_spaces' => true,
                  'blank_line_before_statement' => [
                      'statements' => ['break', 'continue', 'declare', 'return', 'throw', 'try'],
                  ],
              ])
              ->setFinder($finder);
          EOF

      - name: Run PHP CS Fixer (dry-run)
        run: |
          if [ -f "./vendor/bin/php-cs-fixer" ]; then
            ./vendor/bin/php-cs-fixer fix --dry-run --diff --verbose
          elif [ -f "./php-cs-fixer" ]; then
            ./php-cs-fixer fix --dry-run --diff --verbose
          else
            echo "⚠️ PHP CS Fixer not available, skipping code style check"
          fi

      - name: Check for duplicate code
        run: |
          echo "Installing PHPCPD..."
          if composer require --dev sebastian/phpcpd --with-all-dependencies; then
            ./vendor/bin/phpcpd app/ --min-lines=5 --min-tokens=50 || echo "⚠️ Duplicate code detected"
          else
            echo "⚠️ PHPCPD installation failed, skipping duplicate detection"
          fi
