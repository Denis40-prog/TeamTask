name: Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality Analysis

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, sqlite, pcov

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('**/composer.lock') }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Install Larastan
        run: composer require --dev larastan/larastan

      - name: Create PHPStan config
        run: |
          cat > phpstan.neon << EOF
          includes:
              - vendor/larastan/larastan/extension.neon

          parameters:
              paths:
                  - app/
                  - routes/
                  - database/
              level: 6
              ignoreErrors:
                  - '#Call to an undefined method Illuminate\\Database\\Eloquent\\Builder::.*#'
                  - '#Call to an undefined method Illuminate\\Database\\Query\\Builder::.*#'
              excludePaths:
                  - */vendor/*
                  - */node_modules/*
                  - */storage/*
                  - */bootstrap/cache/*
          EOF

      - name: Run PHPStan Analysis
        run: ./vendor/bin/phpstan analyse --memory-limit=2G

      - name: Install PHP CS Fixer
        run: composer require --dev friendsofphp/php-cs-fixer

      - name: Create PHP CS Fixer config
        run: |
          cat > .php-cs-fixer.php << 'EOF'
          <?php

          $finder = Symfony\Component\Finder\Finder::create()
              ->in([
                  __DIR__ . '/app',
                  __DIR__ . '/config',
                  __DIR__ . '/database',
                  __DIR__ . '/routes',
                  __DIR__ . '/tests',
              ])
              ->name('*.php')
              ->notName('*.blade.php')
              ->ignoreDotFiles(true)
              ->ignoreVCS(true);

          return (new PhpCsFixer\Config())
              ->setRules([
                  '@PSR2' => true,
                  '@Symfony' => true,
                  'array_syntax' => ['syntax' => 'short'],
                  'ordered_imports' => ['sort_algorithm' => 'alpha'],
                  'no_unused_imports' => true,
                  'not_operator_with_successor_space' => true,
                  'trailing_comma_in_multiline' => true,
                  'phpdoc_scalar' => true,
                  'unary_operator_spaces' => true,
                  'binary_operator_spaces' => true,
                  'blank_line_before_statement' => [
                      'statements' => ['break', 'continue', 'declare', 'return', 'throw', 'try'],
                  ],
              ])
              ->setFinder($finder);
          EOF

      - name: Run PHP CS Fixer (dry-run)
        run: ./vendor/bin/php-cs-fixer fix --dry-run --diff --verbose

      - name: Check for duplicate code
        run: |
          composer require --dev sebastian/phpcpd
          ./vendor/bin/phpcpd app/ --min-lines=5 --min-tokens=50
