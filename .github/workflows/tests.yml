name: tests

on: [push, pull_request]

jobs:
  pest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP setup
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, sqlite, pcov
          coverage: pcov

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('**/composer.lock') }}

      - name: Install deps
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: App key + env
        run: |
          # Generate APP_KEY for testing
          APP_KEY=$(php -r "echo 'base64:' . base64_encode(random_bytes(32));")
          echo "Generated APP_KEY: $APP_KEY"

          # Create fresh .env.testing with proper APP_KEY
          cat > .env.testing << EOF
          APP_ENV=testing
          APP_KEY=${APP_KEY}
          APP_DEBUG=true
          APP_URL=http://localhost

          DB_CONNECTION=sqlite
          DB_DATABASE=:memory:

          CACHE_STORE=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array

          LOG_CHANNEL=null
          EOF

          # Verify the configuration
          echo "Updated .env.testing file:"
          cat .env.testing

      - name: Setup database
        run: |
          # Create database directory
          mkdir -p database
          
          # Create empty SQLite file for any non-memory operations
          touch database/database.sqlite
          
          # Clear any existing configuration cache
          php artisan config:clear --env=testing || echo "Config cleared"

      - name: Run migrations
        run: APP_ENV=testing php artisan migrate --force --env=testing

      - name: Run tests
        run: APP_ENV=testing ./vendor/bin/pest --parallel --coverage
