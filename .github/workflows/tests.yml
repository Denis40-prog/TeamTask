name: tests

on: [push, pull_request]

jobs:
  pest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP setup
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, sqlite, pcov
          coverage: pcov

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('**/composer.lock') }}

      - name: Install deps
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: App key + env
        run: |
          # Generate APP_KEY for testing
          APP_KEY=$(php -r "echo 'base64:' . base64_encode(random_bytes(32));")
          echo "Generated APP_KEY: $APP_KEY"
          
          # Create fresh .env.testing with proper APP_KEY
          cat > .env.testing << EOF
          APP_ENV=testing
          APP_KEY=${APP_KEY}
          APP_DEBUG=true
          APP_URL=http://localhost

          DB_CONNECTION=sqlite
          DB_DATABASE=:memory:

          CACHE_STORE=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array

          LOG_CHANNEL=null
          EOF
          
          # Verify the configuration
          echo "Updated .env.testing file:"
          cat .env.testing
          
          # Clear Laravel caches to ensure fresh config
          php artisan config:clear
          php artisan cache:clear
          
          # Verify the APP_KEY is loaded in Laravel
          echo "Testing APP_KEY loading:"
          php artisan tinker --execute="echo 'Laravel APP_KEY: ' . config('app.key') . PHP_EOL;"

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests
        run: ./vendor/bin/pest --parallel --coverage
